services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=http://localhost:8000
    restart: always
    ports:
      - "3000:3000"
    # Memetakan localhost kontainer ke host-gateway agar API call dari kontainer 
    # ke http://localhost:8000 bisa diarahkan ke backend yang berjalan di host.
    extra_hosts:
      - "localhost:host-gateway"
    env_file:
      - .env.local
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
